<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산업연관표 분석 웹앱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>📊 산업연관표 분류 선택</h2>
        <p>원하는 산업 분류 체계 카드를 클릭하세요.</p>

        <!-- 카드 4개 버튼 영역 -->
        <div class="card-grid">
            <div class="io-card" data-type="대분류">
                <div class="card-num">33</div>
                <div class="card-title">대분류</div>
                <div class="card-size">0.6MB</div>
            </div>
            <div class="io-card" data-type="중분류">
                <div class="card-num">83</div>
                <div class="card-title">중분류</div>
                <div class="card-size">1.2MB</div>
            </div>
            <div class="io-card" data-type="소분류">
                <div class="card-num">165</div>
                <div class="card-title">소분류</div>
                <div class="card-size">3.1MB</div>
            </div>
            <!-- 기본부문에 active 클래스를 넣으면 처음부터 파란색으로 선택되어 있습니다 -->
            <div class="io-card active" data-type="기본부문">
                <div class="card-num">380</div>
                <div class="card-title">기본부문</div>
                <div class="card-size">12.3MB</div>
            </div>
        </div>

        <!-- 클릭하면 결과가 나오는 영역 -->
        <div id="status-message" class="status-box">선택된 분류: 기본부문 (데이터를 읽어오는 중...)</div>
        <div id="result-display" class="result-box"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
